<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>OpenBundle report</title>
  <style>
    :root {
      --bg: #171416;
      --rail: #211d1f;
      --panel: #2a2528;
      --panel-2: #332d31;
      --panel-3: #3a3337;
      --ink: #faf7f4;
      --muted: #aaa1a5;
      --faint: #756d71;
      --line: rgba(255,255,255,.10);
      --line-strong: rgba(255,255,255,.17);
      --orange: #ff681f;
      --orange-soft: #ff9a5c;
      --red: #ff3448;
      --green: #3bd28b;
      --gold: #ffd166;
      --display: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --shadow: 0 20px 55px rgba(0,0,0,.26);
      --binary: #2188f2;
      --asset_catalog: #19ad83;
      --image: #00a9cf;
      --video: #6d5fe5;
      --audio: #a855d1;
      --animation: #c67c00;
      --localization: #e87815;
      --font: #9658d4;
      --coreml: #7165e8;
      --interface: #009c9c;
      --signature: #a9853c;
      --metadata: #64748b;
      --other: #737e8c;
      --binary_section: #297bd8;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 74% 8%, rgba(80,49,153,.18), transparent 38rem),
        radial-gradient(circle at 18% 96%, rgba(255,104,31,.08), transparent 32rem),
        var(--bg);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.42;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .app-shell {
      width: 100%;
      height: 100vh;
      display: grid;
      grid-template-columns: 252px minmax(0,1fr);
    }

    /* Side rail */
    .rail {
      position: relative;
      z-index: 5;
      display: flex;
      min-height: 0;
      flex-direction: column;
      padding: 24px 18px 18px;
      background:
        linear-gradient(180deg, rgba(255,104,31,.055), transparent 15rem),
        rgba(31,27,29,.96);
      border-right: 1px solid var(--line);
      box-shadow: 14px 0 40px rgba(0,0,0,.12);
    }
    .rail-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 6px 22px;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 10px;
      color: #211719;
      background: var(--orange);
      box-shadow: 0 8px 24px rgba(255,104,31,.20);
    }
    .brand-mark svg { width: 19px; }
    .brand-name { font-weight: 850; letter-spacing: -.025em; }
    .brand-byline {
      margin-top: 1px;
      color: var(--faint);
      font-size: 9px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .rail-app {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 15px;
    }
    .app-icon {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      overflow: hidden;
      border-radius: 12px;
      color: #1a1718;
      background: linear-gradient(145deg,#ff9d60,#ff5b15);
      font-weight: 900;
    }
    .app-icon img { width: 100%; height: 100%; object-fit: cover; }
    .rail-app-copy { min-width: 0; }
    .rail-app h1 {
      margin: 0;
      overflow: hidden;
      font-family: var(--display);
      font-size: 18px;
      line-height: 1.12;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rail-app p {
      margin: 3px 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .side-nav { display: grid; gap: 5px; margin: 18px 0; }
    .side-nav button {
      width: 100%;
      display: grid;
      grid-template-columns: 26px minmax(0,1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 10px 11px;
      border: 0;
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      text-align: left;
      font-weight: 720;
    }
    .side-nav button:hover { color: var(--ink); background: rgba(255,255,255,.045); }
    .side-nav button.active {
      color: var(--ink);
      background: var(--panel-2);
      box-shadow: inset 3px 0 var(--orange);
    }
    .nav-icon {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: currentColor;
      background: rgba(255,255,255,.055);
      font-size: 12px;
    }
    .nav-count {
      min-width: 21px;
      padding: 2px 6px;
      border-radius: 10px;
      color: var(--muted);
      background: rgba(255,255,255,.06);
      font-size: 9px;
      text-align: center;
    }
    .rail-size {
      padding: 16px 14px 13px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .rail-size-label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .rail-size-value {
      margin-top: 2px;
      font-family: var(--display);
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -.045em;
    }
    .rail-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 12px;
      margin-top: 13px;
    }
    .rail-metric span { display: block; color: var(--faint); font-size: 9px; }
    .rail-metric strong { display: block; margin-top: 2px; font-size: 12px; }
    .rail-metric.opportunity strong { color: var(--orange-soft); }
    .rail-footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 7px 2px;
      color: var(--faint);
      font-size: 9px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(59,210,139,.10);
    }

    /* Workspace */
    .workspace { min-width: 0; min-height: 0; overflow: hidden; }
    .view {
      display: none;
      height: 100vh;
      padding: 24px;
      overflow: auto;
      animation: view-in 180ms ease both;
    }
    .view.active { display: block; }
    @keyframes view-in { from { opacity: .4; transform: translateY(3px); } }
    .view-head {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
    }
    .view-kicker {
      color: var(--orange);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .17em;
      text-transform: uppercase;
    }
    .view-head h2 {
      margin: 3px 0 0;
      font-family: var(--display);
      font-size: clamp(25px,2.5vw,36px);
      line-height: 1;
      letter-spacing: -.035em;
    }
    .head-actions { display: flex; align-items: center; gap: 8px; }
    .search-wrap { position: relative; width: min(28vw,340px); }
    .search-wrap svg {
      position: absolute;
      left: 11px;
      top: 10px;
      width: 15px;
      color: var(--faint);
      pointer-events: none;
    }
    .search {
      width: 100%;
      height: 36px;
      padding: 0 12px 0 34px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: 0;
      color: var(--ink);
      background: rgba(0,0,0,.19);
    }
    .search:focus { border-color: rgba(255,104,31,.72); box-shadow: 0 0 0 3px rgba(255,104,31,.10); }
    .segmented {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(0,0,0,.14);
    }
    .segmented button, .icon-button {
      border: 0;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 750;
    }
    .segmented button { padding: 6px 8px; }
    .segmented button.active { color: var(--ink); background: var(--panel-3); }
    .icon-button {
      height: 36px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border: 1px solid var(--line);
    }
    .icon-button:hover, .icon-button.active { color: var(--ink); border-color: var(--line-strong); background: var(--panel-2); }
    .icon-button.active.duplicate-toggle { color: white; border-color: var(--red); background: var(--red); }
    .tiny-square { width: 8px; height: 8px; border-radius: 3px; background: var(--red); }

    /* Size Lens */
    .lens-card {
      position: relative;
      min-height: 590px;
      height: calc(100vh - 110px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background:
        radial-gradient(circle at 52% 46%, rgba(70,43,134,.22), transparent 30rem),
        radial-gradient(circle at 12% 92%, rgba(0,169,207,.08), transparent 22rem),
        rgba(24,20,24,.74);
      box-shadow: var(--shadow);
    }
    .lens-bar {
      position: absolute;
      inset: 0 0 auto;
      z-index: 20;
      height: 50px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(27,23,27,.82);
      backdrop-filter: blur(18px);
    }
    .back-button {
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255,255,255,.055);
      cursor: pointer;
    }
    .back-button:hover:not(:disabled) { color: var(--ink); background: rgba(255,255,255,.09); }
    .back-button:disabled { opacity: .28; cursor: default; }
    .crumbs {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 3px;
      overflow: hidden;
      white-space: nowrap;
    }
    .crumbs button {
      max-width: 190px;
      overflow: hidden;
      border: 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .crumbs button:last-of-type { color: var(--ink); font-weight: 750; }
    .crumb-sep { color: var(--faint); font-size: 10px; }
    .lens-meta {
      margin-left: auto;
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .bubble-lens {
      position: absolute;
      inset: 51px 0 0;
      overflow: hidden;
      user-select: none;
    }
    .bubble {
      position: absolute;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.34);
      border-radius: 50%;
      color: white;
      background: var(--bubble);
      cursor: default;
      transform: translateZ(0);
      transition: border-color 160ms ease, filter 160ms ease, transform 160ms ease;
      animation: particle-in 220ms ease-out both;
    }
    @keyframes particle-in { from { opacity: 0; } }
    .bubble.zoomable { cursor: pointer; }
    .bubble.zoomable:focus-visible {
      z-index: 14;
      outline: 3px solid rgba(255,255,255,.92);
      outline-offset: 3px;
    }
    .bubble:hover {
      z-index: 12;
      border-color: rgba(255,255,255,.92);
      filter: brightness(1.08) saturate(1.12);
      transform: scale(1.035);
    }
    .bubble.duplicate {
      --bubble: var(--red) !important;
      border-width: 3px;
      border-color: #ffd3d8;
    }
    .bubble.has-preview::before,
    .bubble.has-preview::after {
      position: absolute;
      z-index: 0;
      left: 12%;
      top: 33%;
      width: 76%;
      height: 34%;
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 50%;
      content: "";
      opacity: .12;
      pointer-events: none;
      transform: rotate(-28deg);
      transition: opacity 180ms ease, transform 360ms cubic-bezier(.2,.8,.2,1);
    }
    .bubble.has-preview::after {
      transform: rotate(32deg);
    }
    .bubble.has-preview:hover::before {
      opacity: .48;
      transform: rotate(-20deg);
    }
    .bubble.has-preview:hover::after {
      opacity: .48;
      transform: rotate(40deg);
    }
    .bubble-lens.suppress-hover .bubble:hover {
      z-index: auto;
      border-color: rgba(255,255,255,.34);
      filter: none;
      transform: translateZ(0);
    }
    .bubble-lens.suppress-hover .bubble.has-preview:hover::before {
      opacity: .12;
      transform: rotate(-28deg);
    }
    .bubble-lens.suppress-hover .bubble.has-preview:hover::after {
      opacity: .12;
      transform: rotate(32deg);
    }
    .bubble-lens.suppress-hover .bubble.has-preview:hover .bubble-child {
      opacity: .36;
      transform: scale(.86);
    }
    .bubble-lens.suppress-hover .bubble.has-preview:hover .bubble-child span { opacity: 0; }
    .bubble-lens.suppress-hover .bubble.has-preview:hover .bubble-label {
      opacity: 1;
      transform: none;
    }
    .bubble-flag {
      position: absolute;
      z-index: 5;
      top: 12%;
      right: 16%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      border: 2px solid rgba(35,25,20,.42);
    }
    .bubble-child {
      position: absolute;
      z-index: 1;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.38);
      border-radius: 50%;
      color: white;
      background: var(--child);
      opacity: .36;
      pointer-events: none;
      transform: scale(.86);
      transition: opacity 180ms ease, transform 240ms cubic-bezier(.2,.82,.2,1);
    }
    .bubble-child span {
      display: block;
      width: 72%;
      overflow: hidden;
      font-size: var(--child-font,8px);
      font-weight: 800;
      line-height: 1.05;
      opacity: 0;
      text-align: center;
      text-overflow: ellipsis;
      text-shadow: 0 1px 2px rgba(0,0,0,.32);
      transition: opacity 150ms ease;
      white-space: nowrap;
    }
    .bubble.has-preview:hover .bubble-child {
      opacity: 1;
      transform: scale(1);
    }
    .bubble.has-preview:hover .bubble-child span { opacity: 1; }
    .bubble.has-preview:hover .bubble-label { opacity: 0; transform: scale(.88); }
    .bubble-child.compound {
      outline: 1px solid rgba(255,255,255,.24);
      outline-offset: 2px;
    }
    .bubble-lens.transitioning {
      cursor: progress;
    }
    .bubble-lens.transitioning > .bubble {
      pointer-events: none;
      animation: none;
      transition: none;
    }
    .lens-transition-layer {
      position: absolute;
      inset: 0;
      z-index: 90;
      overflow: hidden;
      pointer-events: none;
    }
    .lens-transition-layer .bubble {
      pointer-events: none;
      animation: none !important;
      transition: none !important;
    }
    .bubble-label {
      position: relative;
      z-index: 3;
      width: 74%;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0,0,0,.42);
      transition: opacity 150ms ease, transform 180ms ease;
    }
    .bubble-label strong {
      display: block;
      overflow: hidden;
      font-size: var(--bubble-font,12px);
      font-weight: 820;
      line-height: 1.12;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bubble-label span {
      display: block;
      margin-top: 3px;
      font-size: max(9px,calc(var(--bubble-font,12px) * .72));
      font-weight: 680;
      opacity: .85;
    }
    .bubble-peek {
      position: absolute;
      z-index: 30;
      left: 50%;
      bottom: 16px;
      display: none;
      max-width: min(640px,calc(100% - 32px));
      align-items: center;
      gap: 10px;
      padding: 9px 13px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: rgba(24,20,23,.91);
      box-shadow: 0 12px 35px rgba(0,0,0,.28);
      backdrop-filter: blur(18px);
      transform: translateX(-50%);
    }
    .bubble-peek.visible { display: flex; }
    .peek-dot { width: 9px; height: 9px; flex: 0 0 auto; border-radius: 50%; background: var(--peek); }
    .peek-copy { min-width: 0; }
    .peek-copy strong { display: block; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .peek-copy span { display: block; overflow: hidden; color: var(--muted); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .peek-size { margin-left: 12px; font-family: var(--display); font-size: 16px; font-weight: 800; white-space: nowrap; }
    .empty-state { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-weight: 700; }

    /* Quick wins */
    .wins-total {
      padding: 9px 13px;
      border: 1px solid rgba(255,104,31,.28);
      border-radius: 12px;
      color: var(--orange-soft);
      background: rgba(255,104,31,.07);
      font-family: var(--display);
      font-size: 17px;
      font-weight: 800;
    }
    .win-filters { display: flex; gap: 6px; margin: 4px 0 14px; }
    .win-filter {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 750;
    }
    .win-filter.active { color: var(--ink); background: var(--panel-2); border-color: var(--line-strong); }
    .wins-grid {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 11px;
      padding-bottom: 24px;
    }
    .win-card {
      --win: var(--orange);
      position: relative;
      min-width: 0;
      padding: 17px 18px 15px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 10px 30px rgba(0,0,0,.10);
    }
    .win-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--win); }
    .win-card[data-id="duplicates"], .win-card[data-id="duplicate-components"] { --win: var(--red); }
    .win-card[data-kind="review"] { --win: #7667dc; }
    .win-top { display: flex; align-items: center; gap: 8px; }
    .win-type {
      color: var(--win);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .win-saving {
      margin-left: auto;
      color: var(--ink);
      font-family: var(--display);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .win-card h3 {
      margin: 10px 0 5px;
      font-family: var(--display);
      font-size: 20px;
      line-height: 1.08;
      letter-spacing: -.02em;
    }
    .win-card > p { min-height: 2.7em; margin: 0; color: var(--muted); font-size: 11px; }
    .win-details { margin-top: 12px; border-top: 1px solid var(--line); }
    .win-details summary {
      padding-top: 10px;
      color: var(--faint);
      cursor: pointer;
      font-size: 9px;
      font-weight: 760;
      list-style: none;
    }
    .win-details summary::-webkit-details-marker { display: none; }
    .win-details summary::after { content: "  ›"; }
    .win-details[open] summary::after { content: "  ↓"; }
    .win-paths { max-height: 130px; margin-top: 8px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
    .win-paths div {
      padding: 5px 7px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font: 9px ui-monospace,SFMono-Regular,Menlo,monospace;
      word-break: break-all;
    }
    .win-paths div:first-child { border-top: 0; }

    /* Files */
    .files-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .files-tools { padding: 12px; border-bottom: 1px solid var(--line); }
    .files-tools .search-wrap { width: min(100%,420px); }
    .table-scroll { max-height: calc(100vh - 145px); overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 10px 12px;
      color: var(--faint);
      background: #252123;
      font-size: 9px;
      letter-spacing: .07em;
      text-align: left;
      text-transform: uppercase;
    }
    td { padding: 10px 12px; border-top: 1px solid var(--line); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    td strong { display: block; }
    .subpath { max-width: 560px; overflow: hidden; color: var(--faint); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .category-chip { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
    .chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot); }
    tr.duplicate-row { background: rgba(255,52,72,.055); }
    tr.duplicate-row td:first-child { box-shadow: inset 3px 0 var(--red); }
    .duplicate-badge {
      margin-left: 6px;
      padding: 2px 5px;
      border-radius: 4px;
      color: white;
      background: var(--red);
      font-size: 7px;
      font-weight: 900;
    }

    @media (max-width: 1050px) {
      .app-shell { grid-template-columns: 220px minmax(0,1fr); }
      .rail { padding-inline: 14px; }
      .view { padding: 18px; }
      .view-head { align-items: flex-start; }
      .head-actions { flex-wrap: wrap; justify-content: flex-end; }
      .search-wrap { width: 250px; }
      .wins-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      body { overflow: auto; }
      .app-shell { height: auto; min-height: 100vh; display: block; }
      .rail { position: static; min-height: 0; padding: 12px; border-right: 0; border-bottom: 1px solid var(--line); }
      .rail-brand { padding: 0 3px 10px; }
      .brand-byline, .rail-size, .rail-footer { display: none; }
      .rail-app { padding: 9px 10px; }
      .side-nav { grid-template-columns: repeat(3,1fr); margin: 9px 0 0; }
      .side-nav button { grid-template-columns: 22px minmax(0,1fr); padding: 8px; }
      .side-nav button.active { box-shadow: inset 0 -3px var(--orange); }
      .nav-icon { width: 22px; height: 22px; }
      .nav-count { display: none; }
      .workspace { overflow: visible; }
      .view { height: auto; min-height: 700px; padding: 14px 10px; overflow: visible; }
      .view-head { display: block; min-height: 0; }
      .head-actions { margin-top: 13px; justify-content: flex-start; }
      .head-actions .search-wrap { width: 100%; order: -1; }
      .lens-card { height: 68vh; min-height: 520px; }
      .segmented button { padding-inline: 6px; }
      .wins-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

            <thead><tr><th>Name</th><th>Type</th><th>Content</th><th class="num">Files</th><th class="num">Bundle</th><th class="num">Download</th><th class="num">Wins</th></tr></thead>

  <script id="report-data" type="application/json">__REPORT_DATA__</script>
  <script>
  (() => {
    "use strict";
    const REPORT = JSON.parse(document.getElementById("report-data").textContent);
    const DANGER = "#ff3448";
    const VIBRANT = [
      "#2f80ed","#00a6fb","#00b8d9","#00c2a8","#19b96e","#72bd33",
      "#d6aa16","#ff8a1f","#f35bbd","#d94ecb","#ad62e8","#8b67f2",
      "#665ef4","#5167e8","#0aa0a8","#16a085"
    ];
    const CATEGORY_PALETTES = {
      binary:["#2f80ed","#5167e8","#665ef4","#00a6fb","#8b67f2"],
      binary_section:["#00a6fb","#2f80ed","#5167e8","#665ef4","#ad62e8","#00b8d9"],
      asset_catalog:["#00c2a8","#19b96e","#72bd33","#0aa0a8","#16a085"],
      image:["#00b8d9","#00a6fb","#00c2a8","#19b96e"],
      video:["#8b67f2","#ad62e8","#d94ecb","#5167e8"],
      audio:["#f35bbd","#d94ecb","#ad62e8","#8b67f2"],
      animation:["#ff8a1f","#d6aa16","#f35bbd","#ad62e8"],
      localization:["#ff8a1f","#d6aa16","#72bd33","#f35bbd"],
      font:["#ad62e8","#d94ecb","#f35bbd","#665ef4"],
      coreml:["#665ef4","#8b67f2","#00a6fb","#00b8d9"],
      interface:["#00c2a8","#00b8d9","#00a6fb","#19b96e"],
      signature:["#d6aa16","#ff8a1f","#72bd33"],
      metadata:["#66758f","#746f97","#4d829b"],
      other:VIBRANT
    };
    const SECTION_COLORS = {
      "__text":"#2f80ed","__const":"#665ef4","__cstring":"#d6aa16","__objc":"#ff8a1f",
      "__swift5":"#ad62e8","__data":"#00c2a8","__linkedit":"#5167e8","__llvm_cov":"#d94ecb","__llvm":"#8b67f2"
    };
    const esc = value => String(value ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const fmt = value => {
      if (value == null || Number.isNaN(Number(value))) return "—";
      const units=["B","KB","MB","GB"]; let v=Number(value),i=0;
      while(Math.abs(v)>=1000&&i<units.length-1){v/=1000;i++;}
      return `${v>=100||i===0?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2)} ${units[i]}`;
    };
    const hash = value => {
      let result=2166136261;
      for(const char of String(value||"")){result^=char.charCodeAt(0);result=Math.imul(result,16777619);}
      return result>>>0;
    };
    const categoryName = id => REPORT.categories.find(category=>category.id===id)?.label || String(id||"other").replaceAll("_"," ");
    function nodeColor(node) {
      if(node.duplicateGroup) return DANGER;
      const name=String(node.name||"").toLowerCase(), path=String(node.path||name);
      if(node.category==="binary_section"){
        if(name.startsWith("__llvm_prf")||name.startsWith("__llvm_cov")) return SECTION_COLORS.__llvm_cov;
        if(name.startsWith("__swift5")) return SECTION_COLORS.__swift5;
        if(name.startsWith("__objc")) return SECTION_COLORS.__objc;
        const match=Object.entries(SECTION_COLORS).find(([key])=>name===key||name.startsWith(`${key}_`));
        return match?.[1] || CATEGORY_PALETTES.binary_section[hash(path)%CATEGORY_PALETTES.binary_section.length];
      }
      const palette=CATEGORY_PALETTES[node.category]||VIBRANT;
      return palette[hash(path)%palette.length];
    }

    const app=REPORT.app, metrics=REPORT.metrics;
    document.title=`${app.name} · OpenBundle`;
    const initials=app.name.split(/\s+/).slice(0,2).map(value=>value[0]).join("").toUpperCase();
    const icon=app.iconDataURL?`<span class="app-icon"><img src="${esc(app.iconDataURL)}" alt=""></span>`:`<span class="app-icon">${esc(initials||"A")}</span>`;
    document.getElementById("rail-app").innerHTML=`${icon}<div class="rail-app-copy"><h1>${esc(app.name)}</h1><p>${esc(app.version)} (${esc(app.build)}) · ${esc(app.artifactKind)}</p></div>`;
    document.getElementById("rail-size").innerHTML=`
      <div class="rail-size-label">Bundle size</div><div class="rail-size-value">${fmt(metrics.logicalSize)}</div>
      <div class="rail-metrics">
        <div class="rail-metric"><span>Download</span><strong>${fmt(metrics.compressedSize)}</strong></div>
        <div class="rail-metric"><span>Install</span><strong>${fmt(metrics.allocatedSize)}</strong></div>
        <div class="rail-metric opportunity"><span>Found</span><strong>${fmt(metrics.opportunityBytes)}</strong></div>
        <div class="rail-metric"><span>Files</span><strong>${Number(metrics.fileCount).toLocaleString()}</strong></div>
      </div>`;
    document.getElementById("win-count").textContent=REPORT.insights.length;
    document.getElementById("local-status").textContent=`Local · ${new Date(REPORT.generatedAt).toLocaleDateString()}`;

    document.querySelectorAll(".side-nav button").forEach(button=>button.addEventListener("click",()=>{
      document.querySelectorAll(".side-nav button").forEach(item=>item.classList.toggle("active",item===button));
      document.querySelectorAll(".view").forEach(view=>view.classList.toggle("active",view.id===`view-${button.dataset.view}`));
      if(button.dataset.view==="xray") requestAnimationFrame(renderLens);
    }));

    function deepClone(node){return{...node,_source:node,children:(node.children||[]).map(deepClone)};}
    const treeState={metric:"size",query:"",duplicates:false,focusStack:[REPORT.tree],hovered:null,selected:null,animating:false,transitionId:0};
    const focusNode=()=>treeState.focusStack.at(-1);
    function filterNode(node,inheritedTextMatch=false){
      const query=treeState.query.trim().toLowerCase(),queryActive=Boolean(query);
      const ownTextMatch=!queryActive||`${node.name} ${node.path}`.toLowerCase().includes(query);
      const textMatch=inheritedTextMatch||ownTextMatch;
      const children=node.children||[];
      const duplicateMatch=!treeState.duplicates||Boolean(node.duplicateGroup);
      if(!children.length) return textMatch&&duplicateMatch?deepClone(node):null;
      const passWhole=textMatch&&duplicateMatch&&((queryActive&&(inheritedTextMatch||ownTextMatch))||(treeState.duplicates&&Boolean(node.duplicateGroup)));
      const filteredChildren=passWhole?children.map(deepClone):children.map(child=>filterNode(child,textMatch)).filter(Boolean);
      if(!filteredChildren.length) return null;
      const clone={...node,_source:node,children:filteredChildren};
      if(queryActive||treeState.duplicates){
        for(const key of ["size","compressedSize","allocatedSize"]) clone[key]=filteredChildren.reduce((sum,child)=>sum+Number(child[key]||0),0);
      }
      return clone;
    }
    function displayChildren(node){
      const candidates=[];
      if(treeState.duplicates){
        const collect=current=>{
          for(const child of current.children||[]){
            if(child.duplicateGroup)candidates.push(child);
            else collect(child);
          }
        };
        collect(node);
      }else if(treeState.query.trim()){
        const query=treeState.query.trim().toLowerCase();
        const collect=current=>{
          for(const child of current.children||[]){
            const source=child._source||child;
            if(`${source.name} ${source.path}`.toLowerCase().includes(query)) candidates.push(child);
            else collect(child);
          }
        };
        collect(node);
      }else{
        let visibleRoot=node;
        for(let depth=0;depth<4;depth++){
          const children=visibleRoot.children||[];
          if(children.length!==1||(children[0].children||[]).length===0)break;
          visibleRoot=children[0];
        }
        candidates.push(...(visibleRoot.children||[]));
      }
      const sorted=candidates.filter(child=>Number(child[treeState.metric]||child.size||0)>0)
        .sort((a,b)=>Number(b[treeState.metric]||b.size)-Number(a[treeState.metric]||a.size));
      if(sorted.length<=70) return sorted;
      const kept=sorted.slice(0,69),rest=sorted.slice(69);
      const other={
        name:treeState.duplicates?`Other ${rest.length} duplicates`:`Other ${rest.length} items`,
        path:`${node.path||"root"}::other`,kind:"group",category:"other",
        children:rest,metadata:{fileCount:rest.length},insights:[],
        duplicateGroup:treeState.duplicates?"mixed":null,
        size:rest.reduce((sum,item)=>sum+Number(item.size||0),0),
        compressedSize:rest.reduce((sum,item)=>sum+Number(item.compressedSize||0),0),
        allocatedSize:rest.reduce((sum,item)=>sum+Number(item.allocatedSize||0),0)
      };
      return [...kept,other];
    }
    function packCircles(nodes,width,height){
      if(!nodes.length) return[];
      const margin=18,availableWidth=Math.max(80,width-margin*2),availableHeight=Math.max(80,height-margin*2);
      const weighted=nodes.map(node=>Math.log2(2+Math.max(1,Number(node[treeState.metric]||node.size||1))/16384));
      const total=weighted.reduce((sum,value)=>sum+value,0);
      const areaBudget=availableWidth*availableHeight*.54;
      const minRadius=nodes.length>45?12:nodes.length>25?15:18;
      const maxRadius=Math.min(availableWidth,availableHeight)*.25;
      const circles=nodes.map((node,index)=>{
        const radius=Math.min(maxRadius,Math.max(minRadius,Math.sqrt((weighted[index]/total)*areaBudget/Math.PI)));
        const angle=index*2.399963229728653;
        const spread=Math.min(availableWidth,availableHeight)*.042*Math.sqrt(index);
        return{node,r:radius,x:width/2+Math.cos(angle)*spread,y:height/2+Math.sin(angle)*spread,index};
      });
      if(circles.length===1){circles[0].r=Math.min(maxRadius,Math.min(availableWidth,availableHeight)*.31);circles[0].x=width/2;circles[0].y=height/2;return circles;}
      for(let iteration=0;iteration<900;iteration++){
        const attraction=iteration<220?.003:iteration<460?.0007:0;
        for(const circle of circles){
          circle.x+=(width/2-circle.x)*attraction;
          circle.y+=(height/2-circle.y)*attraction;
        }
        for(let i=0;i<circles.length;i++){
          for(let j=i+1;j<circles.length;j++){
            const a=circles[i],b=circles[j],padding=nodes.length>45?3:7;
            let dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy);
            const needed=a.r+b.r+padding;
            if(dist>=needed) continue;
            if(dist<.001){const angle=(i*31+j*17)*.31;dx=Math.cos(angle);dy=Math.sin(angle);dist=1;}
            const overlap=(needed-dist)*.505,nx=dx/dist,ny=dy/dist;
            const totalRadius=a.r+b.r,moveA=b.r/totalRadius,moveB=a.r/totalRadius;
            a.x-=nx*overlap*moveA;a.y-=ny*overlap*moveA;
            b.x+=nx*overlap*moveB;b.y+=ny*overlap*moveB;
          }
        }
        for(const circle of circles){
          circle.x=Math.max(margin+circle.r,Math.min(width-margin-circle.r,circle.x));
          circle.y=Math.max(margin+circle.r,Math.min(height-margin-circle.r,circle.y));
        }
      }
      return circles;
    }
    function previewChildren(node){
      let current=node;
      for(let depth=0;depth<4;depth++){
        const children=(current.children||[]).filter(child=>Number(child[treeState.metric]||child.size||0)>0);
        if(children.length===1&&(children[0].children||[]).length){current=children[0];continue;}
        return children.sort((a,b)=>Number(b[treeState.metric]||b.size)-Number(a[treeState.metric]||a.size));
      }
      return[];
    }
    function packPreview(nodes,parentRadius){
      const limit=parentRadius>=92?6:parentRadius>=66?5:3;
      const visible=nodes.slice(0,limit);
      if(nodes.length>limit){
        const rest=nodes.slice(limit);
        visible.push({
          name:`+${rest.length}`,
          path:`preview-${rest.length}`,
          category:"other",
          size:rest.reduce((sum,node)=>sum+Number(node.size||0),0),
          compressedSize:rest.reduce((sum,node)=>sum+Number(node.compressedSize||0),0),
          allocatedSize:rest.reduce((sum,node)=>sum+Number(node.allocatedSize||0),0)
        });
      }
      if(!visible.length)return[];
      const inner=parentRadius*.76;
      const weights=visible.map(node=>Math.log2(2+Math.max(1,Number(node[treeState.metric]||node.size||1))/16384));
      const total=weights.reduce((sum,value)=>sum+value,0);
      const areaBudget=Math.PI*inner*inner*.5;
      const circles=visible.map((node,index)=>{
        const r=Math.max(4,Math.min(parentRadius*.27,Math.sqrt(weights[index]/total*areaBudget/Math.PI)));
        const angle=index*2.399963229728653;
        const spread=inner*.17*Math.sqrt(index);
        return{node,r,x:parentRadius+Math.cos(angle)*spread,y:parentRadius+Math.sin(angle)*spread,index};
      });
      for(let iteration=0;iteration<180;iteration++){
        for(const circle of circles){
          circle.x+=(parentRadius-circle.x)*.003;
          circle.y+=(parentRadius-circle.y)*.003;
        }
        for(let i=0;i<circles.length;i++){
          for(let j=i+1;j<circles.length;j++){
            const a=circles[i],b=circles[j];
            let dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),needed=a.r+b.r+2;
            if(dist>=needed)continue;
            if(dist<.001){dx=Math.cos((i+1)*(j+2));dy=Math.sin((i+1)*(j+2));dist=1;}
            const push=(needed-dist)*.51,nx=dx/dist,ny=dy/dist;
            a.x-=nx*push*.5;a.y-=ny*push*.5;b.x+=nx*push*.5;b.y+=ny*push*.5;
          }
        }
        for(const circle of circles){
          const dx=circle.x-parentRadius,dy=circle.y-parentRadius,dist=Math.hypot(dx,dy);
          const maximum=Math.max(0,inner-circle.r);
          if(dist>maximum&&dist){circle.x=parentRadius+dx/dist*maximum;circle.y=parentRadius+dy/dist*maximum;}
        }
      }
      return circles;
    }

    const lens=document.getElementById("bubble-lens"),peek=document.getElementById("bubble-peek");
    function showPeek(node,shownSize){
      peek.innerHTML=`<span class="peek-dot" style="--peek:${nodeColor(node)}"></span><span class="peek-copy"><strong>${esc(node.name)}</strong><span>${esc(node.path||REPORT.tree.name)}</span></span><span class="peek-size">${fmt(shownSize)}</span>`;
      peek.classList.add("visible");
    }
    function hidePeek(){if(!treeState.selected)peek.classList.remove("visible");}
    function renderCrumbs(){
      const holder=document.getElementById("crumbs");holder.replaceChildren();
      treeState.focusStack.forEach((item,index)=>{
        if(index){const sep=document.createElement("span");sep.className="crumb-sep";sep.textContent="›";holder.appendChild(sep);}
        const button=document.createElement("button");button.textContent=item.name;
        button.addEventListener("click",()=>{
          if(index===treeState.focusStack.length-1)return;
          navigateToStack(treeState.focusStack.slice(0,index+1));
        });
        holder.appendChild(button);
      });
      document.getElementById("back-button").disabled=treeState.focusStack.length===1;
      document.getElementById("lens-title").textContent=focusNode().name.replace(/\\.app$/i,"");
    }
    function lensRectFor(element,lensRect){
      const rect=element.getBoundingClientRect();
      return{
        left:rect.left-lensRect.left,
        top:rect.top-lensRect.top,
        width:rect.width,
        height:rect.height,
        x:rect.left-lensRect.left+rect.width/2,
        y:rect.top-lensRect.top+rect.height/2,
        r:Math.min(rect.width,rect.height)/2
      };
    }
    function snapshotLens(lensRect){
      return[...lens.querySelectorAll(":scope > .bubble")].map(element=>{
        const clone=element.cloneNode(true),computed=getComputedStyle(element);
        clone.style.animation="none";
        clone.style.transition="none";
        clone.style.transform=computed.transform==="none"?"none":computed.transform;
        clone.style.filter=computed.filter;
        return{
          clone,
          path:element.dataset.path||"",
          rect:lensRectFor(element,lensRect),
          transform:clone.style.transform||"none"
        };
      });
    }
    function finishLensTransition(id,layer,animations){
      Promise.all(animations.map(animation=>animation.finished.catch(()=>{}))).then(()=>{
        if(id!==treeState.transitionId)return;
        animations.forEach(animation=>{try{animation.cancel();}catch(error){}});
        layer.remove();
        lens.classList.remove("transitioning","suppress-hover");
        treeState.animating=false;
      });
    }
    function transitionFocus(nextStack,{direction,anchorElement=null,departingNode=null}={}){
      if(treeState.animating)return;
      const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if(reduceMotion){
        treeState.focusStack=nextStack;
        treeState.selected=null;
        renderLens();
        return;
      }
      const lensRect=lens.getBoundingClientRect();
      const snapshots=snapshotLens(lensRect);
      const sourceRect=anchorElement?lensRectFor(anchorElement,lensRect):null;
      const sourcePath=anchorElement?.dataset.path||"";
      const id=++treeState.transitionId;
      treeState.animating=true;
      treeState.selected=null;
      peek.classList.remove("visible");
      lens.classList.add("transitioning","suppress-hover");
      treeState.focusStack=nextStack;
      renderLens({instant:true});

      const destination=[...lens.querySelectorAll(":scope > .bubble")];
      const layer=document.createElement("div");
      layer.className="lens-transition-layer";
      snapshots.forEach(snapshot=>layer.appendChild(snapshot.clone));
      lens.appendChild(layer);

      const animations=[];
      if(direction==="forward"&&sourceRect){
        const origin={x:sourceRect.x,y:sourceRect.y,r:sourceRect.r};
        snapshots.forEach(snapshot=>{
          const selected=snapshot.path===sourcePath;
          const dx=snapshot.rect.x-origin.x,dy=snapshot.rect.y-origin.y,distance=Math.hypot(dx,dy)||1;
          const drift=selected?0:Math.min(18,distance*.045);
          const endTransform=selected
            ?"scale(1.08)"
            :`translate(${dx/distance*drift}px,${dy/distance*drift}px) scale(.94)`;
          animations.push(snapshot.clone.animate([
            {opacity:1,transform:snapshot.transform},
            {opacity:0,transform:endTransform}
          ],{
            duration:selected?260:230,
            easing:"cubic-bezier(.4,0,.35,1)",
            fill:"forwards"
          }));
        });
        destination.forEach((element,index)=>{
          const finalRect=lensRectFor(element,lensRect);
          const angle=index*2.399963229728653;
          const orbit=Math.min(origin.r*.44,origin.r*(.12+.075*Math.sqrt(index)));
          const startX=origin.x+Math.cos(angle)*orbit;
          const startY=origin.y+Math.sin(angle)*orbit;
          const startRadius=Math.max(7,origin.r*.13);
          const startScale=Math.max(.055,Math.min(.3,startRadius/Math.max(1,finalRect.r)));
          animations.push(element.animate([
            {
              opacity:0,
              transform:`translate(${startX-finalRect.x}px,${startY-finalRect.y}px) scale(${startScale})`
            },
            {opacity:.72,offset:.62},
            {opacity:1,transform:"translate(0,0) scale(1)"}
          ],{
            duration:500,
            delay:24+Math.min(index*7,84),
            easing:"cubic-bezier(.18,.78,.18,1)",
            fill:"both"
          }));
        });
      }else{
        const departingPath=departingNode?.path||"";
        const target=destination.find(element=>element.dataset.path===departingPath);
        const targetRect=target
          ?lensRectFor(target,lensRect)
          :{x:lens.clientWidth/2,y:lens.clientHeight/2,r:Math.min(lens.clientWidth,lens.clientHeight)*.12};
        snapshots.forEach((snapshot,index)=>{
          const angle=index*2.399963229728653;
          const orbit=Math.min(targetRect.r*.38,8+Math.sqrt(index)*4);
          const endX=targetRect.x+Math.cos(angle)*orbit;
          const endY=targetRect.y+Math.sin(angle)*orbit;
          const endScale=Math.max(.045,Math.min(.2,targetRect.r*.1/Math.max(1,snapshot.rect.r)));
          animations.push(snapshot.clone.animate([
            {opacity:1,transform:snapshot.transform},
            {
              opacity:0,
              transform:`translate(${endX-snapshot.rect.x}px,${endY-snapshot.rect.y}px) scale(${endScale})`
            }
          ],{
            duration:430,
            delay:Math.min(index*4,44),
            easing:"cubic-bezier(.5,0,.32,1)",
            fill:"forwards"
          }));
        });
        destination.forEach((element,index)=>{
          const finalRect=lensRectFor(element,lensRect);
          const isTarget=element===target;
          const dx=targetRect.x-finalRect.x,dy=targetRect.y-finalRect.y,distance=Math.hypot(dx,dy)||1;
          const travel=isTarget?0:Math.min(30,distance*.13);
          animations.push(element.animate([
            {
              opacity:isTarget ? .26 : 0,
              transform:`translate(${dx/distance*travel}px,${dy/distance*travel}px) scale(${isTarget ? .82 : .9})`
            },
            {opacity:1,transform:"translate(0,0) scale(1)"}
          ],{
            duration:isTarget?390:360,
            delay:isTarget?20:90+Math.min(index*5,70),
            easing:"cubic-bezier(.18,.72,.2,1)",
            fill:"both"
          }));
        });
      }
      finishLensTransition(id,layer,animations);
    }
    function navigateToStack(nextStack){
      if(treeState.animating||nextStack.length>=treeState.focusStack.length)return;
      transitionFocus(nextStack,{direction:"back",departingNode:focusNode()});
    }
    function drillInto(target,element){
      transitionFocus([...treeState.focusStack,target],{direction:"forward",anchorElement:element});
    }
    function renderLens(options={}){
      if(!lens.clientWidth)return;
      const filtered=filterNode(focusNode());
      lens.replaceChildren();peek.classList.remove("visible");
      renderCrumbs();
      if(!filtered){
        lens.innerHTML=`<div class="empty-state">Nothing found</div>`;
        document.getElementById("lens-meta").textContent="0 items";
        return;
      }
      const nodes=displayChildren(filtered),packed=packCircles(nodes,lens.clientWidth,lens.clientHeight);
      const shownSize=Number(filtered[treeState.metric]||filtered.size||0);
      document.getElementById("lens-meta").textContent=`${nodes.length} items · ${fmt(shownSize)}`;
      const fragment=document.createDocumentFragment();
      packed.forEach(circle=>{
        const display=circle.node,source=display._source||display;
        const element=document.createElement("div");
        const hasChildren=(display.children||source.children||[]).length>0;
        const size=Number(display[treeState.metric]||display.size||0);
        const diameter=circle.r*2;
        element.className=`bubble${hasChildren?" zoomable":""}${source.duplicateGroup?" duplicate":""}`;
        element.style.cssText=`left:${circle.x-circle.r}px;top:${circle.y-circle.r}px;width:${diameter}px;height:${diameter}px;--bubble:${nodeColor(source)};--bubble-font:${Math.max(9,Math.min(17,circle.r/7.2))}px;animation-delay:${Math.min(circle.index*9,180)}ms`;
        if(options.instant)element.style.animation="none";
        element.dataset.path=source.path||"";
        element.setAttribute("aria-label",`${source.name}, ${fmt(size)}`);
        if(hasChildren){
          element.setAttribute("role","button");
          element.tabIndex=0;
          element.addEventListener("keydown",event=>{
            if(event.key!=="Enter"&&event.key!==" ")return;
            event.preventDefault();
            element.click();
          });
        }
        if(hasChildren&&!treeState.query.trim()&&!treeState.duplicates&&circle.r>=38){
          const children=previewChildren(source);
          const nested=packPreview(children,circle.r);
          if(nested.length){
            element.classList.add("has-preview");
            nested.forEach(childCircle=>{
              const child=document.createElement("i"),childDiameter=childCircle.r*2;
              child.className="bubble-child";
              if((childCircle.node.children||[]).length)child.classList.add("compound");
              child.style.cssText=`left:${childCircle.x-childCircle.r}px;top:${childCircle.y-childCircle.r}px;width:${childDiameter}px;height:${childDiameter}px;--child:${nodeColor(childCircle.node)};--child-font:${Math.max(7,Math.min(10,childCircle.r/2.7))}px`;
              if(childCircle.r>=9){
                const childLabel=document.createElement("span");
                childLabel.textContent=childCircle.node.name;
                child.appendChild(childLabel);
              }
              element.appendChild(child);
            });
          }
        }
        if(circle.r>=20){
          const label=document.createElement("span");label.className="bubble-label";
          label.innerHTML=`<strong>${esc(source.name)}</strong>${circle.r>=33?`<span>${fmt(size)}</span>`:""}`;
          element.appendChild(label);
        }
        if((source.insights||[]).length){const flag=document.createElement("i");flag.className="bubble-flag";element.appendChild(flag);}
        element.addEventListener("mouseenter",()=>{
          if(lens.classList.contains("suppress-hover"))return;
          treeState.hovered=source;showPeek(source,size);
        });
        element.addEventListener("mouseleave",()=>{treeState.hovered=null;hidePeek();});
        element.addEventListener("click",event=>{
          event.stopPropagation();
          treeState.selected=source;showPeek(source,size);
          if(hasChildren){
            drillInto(source===display?display:source,element);
          }
        });
        fragment.appendChild(element);
      });
      lens.appendChild(fragment);
    }
    lens.addEventListener("click",()=>{treeState.selected=null;peek.classList.remove("visible");});
    lens.addEventListener("pointermove",event=>{
      if(lens.classList.contains("suppress-hover")&&!event.target.closest(".bubble"))lens.classList.remove("suppress-hover");
    });
    lens.addEventListener("pointerleave",()=>lens.classList.remove("suppress-hover"));
    document.getElementById("back-button").addEventListener("click",()=>{
      if(treeState.focusStack.length>1)navigateToStack(treeState.focusStack.slice(0,-1));
    });
    document.getElementById("tree-search").addEventListener("input",event=>{treeState.query=event.target.value;renderLens();});
    document.getElementById("metric-picker").addEventListener("click",event=>{
      const button=event.target.closest("button");if(!button)return;
      treeState.metric=button.dataset.metric;
      document.querySelectorAll("#metric-picker button").forEach(item=>item.classList.toggle("active",item===button));
      renderLens();
    });
    document.getElementById("duplicates-only").addEventListener("click",event=>{
      treeState.duplicates=!treeState.duplicates;event.currentTarget.classList.toggle("active",treeState.duplicates);renderLens();
    });

    const QUICK_COPY={
      "strip-symbols":["Strip release symbols","Enable stripping after dSYMs are generated."],
      "release-code-coverage":["Turn off release coverage","Remove LLVM profiling from distribution builds."],
      "duplicates":["Merge exact duplicates","Keep one canonical copy per runtime bundle."],
      "duplicate-components":["Remove repeated components","Check whether every target needs each copy."],
      "dynamic-frameworks":["Make small frameworks static","Trial static products for small internal modules."],
      "catalog-target-membership":["Clean up asset targets","Remove catalog membership from targets that never load it."],
      "large-embedded-targets":["Slim the Watch app","Audit its frameworks and resources as a separate product."],
      "missing-linkmaps":["Generate Link Maps","Attribute large binaries to concrete modules and source targets."],
      "swift-reflection":["Trim reflection names","Trial “Without Names” in Release and test reflection paths."],
      "embedded-string-data":["Move payloads out of code","Find generated JSON, lookup tables, and giant literals."],
      "localization-comments":["Minify localizations","Strip translator comments from production copies."],
      "localization-encoding":["Use UTF-8 strings","Emit compact text instead of binary plist string tables."],
      "bundled-video":["Move video on demand","Compress or download clips only when they are needed."],
      "bundled-audio":["Compress bundled audio","Match codec and bitrate to the listening context."],
      "embedded-provisioning":["Check export profiles","Compare the final App Store export; do not edit signed apps."],
      "optimize-images":["Compress large images","Review the simulated quality-85 conversions."],
      "oversized-images":["Resize oversized images","Export to the largest rendered size at device scale."],
      "embedded-bitcode":["Drop legacy bitcode","Update or rebuild dependencies that still carry __LLVM."],
      "unnecessary-files":["Remove build leftovers","Drop source, headers, scripts, and docs from target membership."]
    };
    let winFilter="all";
    function renderWinFilters(){
      const measured=REPORT.insights.filter(item=>Number(item.savings||0)>0).length;
      const review=REPORT.insights.length-measured;
      const values=[["all","All",REPORT.insights.length],["measured","Measured",measured],["review","Review",review]];
      document.getElementById("win-filters").innerHTML=values.map(([id,label,count])=>`<button class="win-filter ${winFilter===id?"active":""}" data-filter="${id}">${label} ${count}</button>`).join("");
      document.querySelectorAll(".win-filter").forEach(button=>button.addEventListener("click",()=>{winFilter=button.dataset.filter;renderWins();}));
    }
    function renderWins(){
      renderWinFilters();
      const filtered=REPORT.insights.filter(item=>winFilter==="all"||(winFilter==="measured"&&Number(item.savings||0)>0)||(winFilter==="review"&&!Number(item.savings||0)));
      document.getElementById("wins-grid").innerHTML=filtered.map(item=>{
        const copy=QUICK_COPY[item.id]||[item.title,item.action];
        const measured=Number(item.savings||0)>0,paths=item.paths||[];
        return `<article class="win-card" data-id="${esc(item.id)}" data-kind="${measured?"measured":"review"}">
          <div class="win-top"><span class="win-type">${measured?"Measured":"Review"}</span>${measured?`<span class="win-saving">${fmt(item.savings)}</span>`:""}</div>
          <h3>${esc(copy[0])}</h3><p>${esc(copy[1])}</p>
          ${paths.length?`<details class="win-details"><summary>${paths.length} affected</summary><div class="win-paths">${paths.slice(0,60).map(path=>`<div>${esc(path)}</div>`).join("")}</div></details>`:""}
        </article>`;
      }).join("")||`<div class="empty-state">No quick wins here</div>`;
    }
    document.getElementById("wins-total").textContent=`${fmt(metrics.opportunityBytes)} found`;

    function renderInventory(query=""){
      const normalized=query.trim().toLowerCase();
      const rows=REPORT.inventory.filter(item=>!normalized||`${item.name} ${item.path} ${item.kind}`.toLowerCase().includes(normalized));
      document.getElementById("inventory-body").innerHTML=rows.map(item=>`<tr class="${item.duplicateGroup?"duplicate-row":""}">
        <td><strong>${esc(item.name)}${item.duplicateGroup?`<span class="duplicate-badge">${esc(item.duplicateGroup)}</span>`:""}</strong><div class="subpath">${esc(item.path)}</div></td>
        <td>${esc(item.kind)}</td>
        <td><span class="category-chip"><i class="chip-dot" style="--dot:${nodeColor(item)}"></i>${esc(categoryName(item.category))}</span></td>
        <td class="num">${Number(item.fileCount||0).toLocaleString()}</td><td class="num">${fmt(item.size)}</td><td class="num">${fmt(item.compressedSize)}</td><td class="num">${item.insightCount||0}</td>
      </tr>`).join("");
    }
    document.getElementById("inventory-search").addEventListener("input",event=>renderInventory(event.target.value));

    renderWins();renderInventory();renderLens();
    let resizeTimer;addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(renderLens,120);});
  })();
  </script>
</body>
