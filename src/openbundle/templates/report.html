<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>OpenBundle report</title>
  <style>
    :root {
      --bg: #211e1d;
      --rail: #292524;
      --panel: #302c2b;
      --panel-raised: #383332;
      --panel-soft: #262221;
      --ink: #fffdfb;
      --muted: #b8b2ae;
      --faint: #a39d99;
      --line: rgba(255,255,255,.11);
      --line-strong: rgba(255,255,255,.2);
      --orange: #ff6719;
      --orange-soft: #ff9b63;
      --green: #42c989;
      --display: Georgia, "Times New Roman", serif;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --shadow: 0 24px 70px rgba(0,0,0,.28);
      --binary: #249ed3;
      --binary_section: #55c7ee;
      --asset_catalog: #39b77e;
      --image: #e8b643;
      --localization: #f07c3c;
      --font: #a678e5;
      --audio: #e05f9c;
      --video: #e85c5c;
      --animation: #e99735;
      --coreml: #6883f2;
      --interface: #30bdb1;
      --signature: #cfad46;
      --metadata: #87939c;
      --other: #6f7c85;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.42;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      position: fixed;
      z-index: 100;
      inset: 0;
      opacity: .018;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      content: "";
    }
    button { color: inherit; font: inherit; }
    button:focus-visible, a:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 2px;
    }
    .skip-link {
      position: fixed;
      z-index: 200;
      top: 10px;
      left: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--ink);
      background: var(--panel-raised);
      box-shadow: var(--shadow);
      font-size: 11px;
      font-weight: 780;
      text-decoration: none;
      transform: translateY(calc(-100% - 14px));
      transition: transform 120ms ease;
    }
    .skip-link:focus { transform: translateY(0); }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    .app-shell {
      width: 100%;
      height: 100vh;
      display: grid;
      grid-template-columns: 232px minmax(0,1fr);
    }

    .rail {
      position: relative;
      z-index: 5;
      display: flex;
      min-height: 0;
      flex-direction: column;
      padding: 22px 16px;
      background: var(--rail);
      border-right: 1px solid var(--line);
      box-shadow: 14px 0 40px rgba(0,0,0,.12);
    }
    .rail-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 5px 20px;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 10px;
      color: white;
      background: var(--orange);
      box-shadow: 0 8px 24px rgba(255,103,25,.2);
    }
    .brand-mark svg { width: 19px; }
    .brand-name { font-size: 15px; font-weight: 850; letter-spacing: -.025em; }
    .brand-byline {
      margin-top: 1px;
      color: var(--faint);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .rail-app {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 13px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .app-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      overflow: hidden;
      border-radius: 11px;
      color: #191514;
      background: linear-gradient(145deg,#ff9d60,#ff5b15);
      font-size: 12px;
      font-weight: 900;
    }
    .app-icon img { width: 100%; height: 100%; object-fit: cover; }
    .rail-app h1 {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      font-family: var(--display);
      font-size: 18px;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .side-nav { display: grid; gap: 5px; margin: 17px 0; }
    .side-nav .nav-divider {
      height: 1px;
      margin: 5px 9px;
      background: var(--line);
    }
    .side-nav button {
      width: 100%;
      display: grid;
      grid-template-columns: 27px minmax(0,1fr);
      gap: 8px;
      align-items: center;
      padding: 9px 10px;
      border: 0;
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      text-align: left;
      font-size: 12px;
      font-weight: 720;
    }
    .side-nav button:hover { color: var(--ink); background: rgba(255,255,255,.045); }
    .side-nav button.active {
      color: var(--ink);
      background: var(--panel-raised);
      box-shadow: inset 3px 0 var(--orange);
    }
    .nav-icon {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: currentColor;
      background: rgba(255,255,255,.055);
    }
    .nav-icon svg { width: 15px; height: 15px; }
    .nav-label {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
    }
    .nav-label > span:first-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nav-count {
      min-width: 19px;
      height: 19px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      padding: 0 5px;
      border-radius: 999px;
      color: #211916;
      background: var(--orange);
      font-size: 10px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    .rail-metrics {
      display: grid;
      gap: 12px;
      padding: 16px 13px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .rail-metric { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .rail-metric span { color: var(--muted); font-size: 11px; }
    .rail-metric strong { font-size: 14px; font-variant-numeric: tabular-nums; }

    .workspace { min-width: 0; min-height: 0; overflow: hidden; }
    .view {
      display: none;
      height: 100vh;
      padding: 22px clamp(18px,2.2vw,34px) 28px;
      overflow: auto;
      animation: view-in 150ms ease both;
    }
    .view.active { display: block; }
    @keyframes view-in { from { opacity: .45; transform: translateY(2px); } }
    .view-head {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
    }
    .view-head h2 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(29px,2.8vw,41px);
      line-height: 1.05;
      letter-spacing: -.025em;
    }
    .head-stat {
      display: flex;
      align-items: baseline;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
    }
    .head-stat strong { color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }

    .map-layout {
      height: calc(100vh - 118px);
      min-height: 580px;
      display: grid;
      grid-template-columns: minmax(0,1fr) 224px;
      gap: 12px;
    }
    .lens-card {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 13px;
      background: #151313;
      box-shadow: var(--shadow);
    }
    .lens-bar {
      position: absolute;
      z-index: 50;
      inset: 0 0 auto;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      border-bottom: 1px solid var(--line);
      background: rgba(39,35,34,.96);
      backdrop-filter: blur(16px);
    }
    .back-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--panel);
      cursor: pointer;
    }
    .back-button:hover { color: white; border-color: var(--orange); }
    .crumbs {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      overflow: hidden;
      white-space: nowrap;
    }
    .crumbs button, .crumb-current {
      max-width: 220px;
      overflow: hidden;
      padding: 4px 5px;
      border: 0;
      border-radius: 5px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .crumbs button:hover { color: white; background: rgba(255,255,255,.05); }
    .crumb-current { color: white; cursor: default; }
    .crumb-sep { color: var(--faint); font-size: 10px; }
    .back-button[hidden] { display: none; }
    .treemap {
      position: absolute;
      inset: 52px 0 0;
      overflow: hidden;
      background: #101112;
      user-select: none;
    }
    .treemap-layer {
      position: absolute;
      inset: 0;
      transform-origin: 0 0;
      will-change: transform,opacity;
    }
    .treemap.animating .treemap-layer { pointer-events: none; }
    .treemap.animating .treemap-hover-frame { opacity: 0 !important; }
    .treemap-hover-frame {
      position: absolute;
      z-index: 45;
      border: 2px solid white;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 70ms ease;
    }
    .treemap-hover-frame.visible { opacity: 1; }
    .treemap-group {
      position: absolute;
      z-index: 1;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 6px;
      background: rgba(255,255,255,.018);
      pointer-events: none;
    }
    .treemap-group-label,
    .treemap-block {
      position: absolute;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.38);
      border-radius: 5px;
      color: white;
      background: var(--tile);
      cursor: pointer;
      text-align: left;
      text-shadow: 0 1px 3px rgba(0,0,0,.62);
    }
    .treemap-group-label {
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      padding: 0 9px 0 10px;
      border-color: rgba(255,255,255,.23);
      border-left: 5px solid var(--tile);
      background: #302d2c;
      cursor: zoom-in;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .005em;
    }
    .treemap-group-label span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .treemap-group-label span:last-child { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; color: #d1cbca; font-size: 10px; }
    .treemap-group-label b { color: var(--orange); font-size: 15px; line-height: 1; }
    .treemap-group-label:hover, .treemap-block:hover { filter: brightness(1.1) saturate(1.04); }
    .treemap-block {
      z-index: 5;
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 0;
      appearance: none;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.38),
        inset 0 0 0 999px rgba(20,17,16,var(--shade,.03));
    }
    .treemap-block.leaf { cursor: default; }
    .treemap-block:hover, .treemap-block:focus-visible { outline: 2px solid white; outline-offset: -2px; }
    .tile-copy {
      position: absolute;
      inset: 7px 8px auto;
      min-width: 0;
      pointer-events: none;
    }
    .tile-name {
      display: block;
      overflow: hidden;
      font-size: var(--tile-font,11px);
      font-weight: 800;
      line-height: 1.08;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tile-size {
      display: block;
      margin-top: 4px;
      color: rgba(255,255,255,.9);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }
    .treemap-block.micro {
      border-radius: 0;
      box-shadow: inset 0 0 0 999px rgba(20,17,16,var(--shade,.03));
    }
    .empty-state { padding: 32px; color: var(--muted); }
    .contents-card {
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 19px 16px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
    }
    .contents-card h3 {
      margin: 0 0 12px;
      font-family: var(--display);
      font-size: 20px;
    }
    .contents-list { display: grid; }
    .content-row {
      display: grid;
      grid-template-columns: 10px minmax(0,1fr) auto;
      gap: 9px;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }
    .content-row:first-child { border-top: 0; }
    .content-row i { width: 9px; height: 9px; border-radius: 3px; background: var(--swatch); }
    .content-row strong { overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .content-row span { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }

    .recommendations-list {
      display: grid;
      gap: 9px;
      max-width: 1040px;
      padding-bottom: 30px;
    }
    .recommendation {
      --tone: var(--orange);
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 10px 28px rgba(0,0,0,.1);
    }
    .recommendation::before { position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--tone); content: ""; }
    .recommendation > summary,
    .recommendation-static-summary {
      min-height: 82px;
      display: grid;
      grid-template-columns: 44px minmax(0,1fr) auto 18px;
      gap: 14px;
      align-items: center;
      padding: 14px 17px;
      cursor: pointer;
      list-style: none;
    }
    .recommendation-static-summary { grid-template-columns: 44px minmax(0,1fr) auto; cursor: default; }
    .recommendation > summary::-webkit-details-marker,
    .recommendation-evidence > summary::-webkit-details-marker { display: none; }
    .recommendation > summary:focus-visible {
      outline: 2px solid var(--tone);
      outline-offset: -3px;
      border-radius: 11px;
    }
    .recommendation[open] > summary { background: color-mix(in srgb,var(--tone) 4%,transparent); }
    .recommendation-chevron,
    .evidence-chevron {
      color: var(--muted);
      transition: transform 150ms ease,color 150ms ease;
    }
    .recommendation[open] > summary .recommendation-chevron,
    .recommendation-evidence[open] > summary .evidence-chevron {
      color: var(--text);
      transform: rotate(90deg);
    }
    .recommendation-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: var(--tone);
      background: color-mix(in srgb,var(--tone) 14%,transparent);
    }
    .recommendation-icon svg { width: 23px; height: 23px; }
    .recommendation-copy { min-width: 0; }
    .recommendation h3 {
      margin: 0;
      font-family: var(--display);
      font-size: 19px;
      line-height: 1.12;
    }
    .recommendation p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .recommendation-saving { padding-left: 15px; text-align: right; white-space: nowrap; }
    .recommendation-saving strong { display: block; font-family: var(--display); font-size: 20px; line-height: 1; }
    .recommendation-details {
      padding: 12px 17px 17px 75px;
      border-top: 1px solid var(--line);
    }
    .recommendation-evidence-list { display: grid; gap: 6px; }
    .recommendation-evidence {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255,255,255,.018);
    }
    .recommendation-evidence[hidden] { display: none; }
    .recommendation-evidence > summary,
    .recommendation-evidence-static {
      min-height: 44px;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto 14px;
      gap: 11px;
      align-items: center;
      padding: 9px 11px;
      list-style: none;
    }
    .recommendation-evidence > summary { cursor: pointer; }
    .recommendation-evidence > summary:focus-visible {
      outline: 2px solid var(--tone);
      outline-offset: -2px;
      border-radius: 8px;
    }
    .recommendation-evidence-static:focus-visible {
      outline: 2px solid var(--tone);
      outline-offset: -2px;
    }
    .recommendation-evidence-static { grid-template-columns: minmax(0,1fr) auto; }
    .evidence-primary { min-width: 0; }
    .evidence-primary strong,
    .evidence-primary code {
      display: block;
      overflow: hidden;
      color: var(--text);
      font-family: var(--body);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .evidence-primary span {
      display: block;
      overflow: hidden;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .evidence-saving {
      color: var(--text);
      font-size: 11px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .evidence-paths {
      padding: 4px 11px 9px;
      border-top: 1px solid var(--line);
    }
    .evidence-path {
      min-height: 30px;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 12px;
      align-items: center;
      border-top: 1px solid color-mix(in srgb,var(--line) 65%,transparent);
    }
    .evidence-path:first-child { border-top: 0; }
    .evidence-path code {
      overflow-wrap: anywhere;
      color: var(--muted);
      font-family: ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size: 10px;
    }
    .evidence-path span {
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .recommendation-more {
      min-height: 44px;
      margin-top: 7px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      color: var(--text);
      background: var(--panel-soft);
      font: 700 10px var(--body);
      cursor: pointer;
    }
    .recommendation-more:hover { border-color: var(--tone); }
    .recommendation-evidence-count {
      display: inline-block;
      margin: 9px 0 0 10px;
      color: var(--muted);
      font-size: 10px;
    }

    .image-browser {
      height: calc(100vh - 118px);
      min-height: 560px;
      display: grid;
      grid-template-columns: 270px minmax(0,1fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .image-sources {
      min-width: 0;
      padding: 12px;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: var(--panel-soft);
    }
    .image-source {
      width: 100%;
      min-height: 44px;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 8px;
      padding: 10px;
      border: 0;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .image-source:hover { color: white; background: rgba(255,255,255,.045); }
    .image-source.active { color: white; background: var(--panel-raised); box-shadow: inset 3px 0 var(--image); }
    .image-source strong { overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .image-source span { color: var(--faint); font-size: 10px; font-variant-numeric: tabular-nums; }
    .image-results { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .image-results-head {
      min-height: 56px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--line);
    }
    .image-results-head h3 { min-width: 0; margin: 0; overflow: hidden; font-family: var(--display); font-size: 19px; text-overflow: ellipsis; white-space: nowrap; }
    .image-results-head span { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .image-list { min-height: 0; overflow: auto; }
    .image-asset { border-top: 1px solid var(--line); }
    .image-asset:first-child { border-top: 0; }
    .image-asset > summary { cursor: pointer; list-style: none; }
    .image-asset > summary::-webkit-details-marker { display: none; }
    .image-asset > summary:hover { background: rgba(255,255,255,.025); }
    .image-asset[open] { background: rgba(0,0,0,.12); }

  <script id="report-data" type="application/json">__REPORT_DATA__</script>
  <script>
  (() => {
    "use strict";
    const REPORT = JSON.parse(document.getElementById("report-data").textContent);
    const METRIC = "size";
    const QUALIFYING_INSIGHTS = [...REPORT.insights]
      .filter(item => typeof item.savings === "number" && Number.isFinite(item.savings) && item.savings >= 100000)
      .sort((a,b) => b.savings - a.savings || String(a.title || a.id).localeCompare(String(b.title || b.id)));
    const recommendationsNav = document.querySelector('[data-view="insights"]');
    document.getElementById("recommendations-count").textContent = QUALIFYING_INSIGHTS.length.toLocaleString();
    recommendationsNav.setAttribute("aria-label",`Recommendations, ${QUALIFYING_INSIGHTS.length.toLocaleString()} available`);
    const COLORS = {
      binary:"#075f7a", binary_section:"#126784", asset_catalog:"#146347",
      image:"#745709", localization:"#803c1e", font:"#5a3d86",
      audio:"#7d3157", video:"#85363f", animation:"#4a631b",
      coreml:"#3f4f99", interface:"#0c655f", signature:"#6b5510",
      metadata:"#48545c", other:"#614536"
    };
    const SECTION_COLORS = {
      __text:"#075f7a", __const:"#344f8c", __cstring:"#176b68",
      __objc:"#683d79", __swift5:"#514786", __data:"#824527",
      __linkedit:"#46565e", __llvm:"#733b53"
    };
    const TONES = {
      binary:"#39b9ef", image:"#e8b643", duplicate:"#ec5b67",
      localization:"#f07c3c", audio:"#e05f9c", video:"#e85c5c",
      animation:"#e99735", other:"#a678e5"
    };
    const SWATCHES = {
      binary:"#249ed3", binary_section:"#55c7ee", asset_catalog:"#39b77e",
      image:"#e8b643", localization:"#f07c3c", font:"#a678e5",
      audio:"#e05f9c", video:"#e85c5c", animation:"#9bbc4a",
      coreml:"#6883f2", interface:"#30bdb1", signature:"#c08d65",
      metadata:"#87939c", other:"#bc8d72"
    };
    const esc = value => String(value ?? "").replace(/[&<>"']/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character]));
    const fmt = value => {
      if (value == null || Number.isNaN(Number(value))) return "—";
      const units = ["B","KB","MB","GB"];
      let number = Number(value), index = 0;
      while (Math.abs(number) >= 1000 && index < units.length - 1) { number /= 1000; index += 1; }
      const digits = number >= 100 || index === 0 ? 0 : number >= 10 ? 1 : 2;
      return `${number.toFixed(digits)} ${units[index]}`;
    };
    const hash = value => {
      let result = 2166136261;
      for (const character of String(value || "")) { result ^= character.charCodeAt(0); result = Math.imul(result,16777619); }
      return result >>> 0;
    };
    const app = REPORT.app;
    const metrics = REPORT.metrics;
    const CAPABILITY_DECLARATIONS = REPORT.capabilities?.declarations || {};
    const BINARY_REPORT = REPORT.binaries || {};
    const binaryItems = Array.isArray(BINARY_REPORT.items) ? BINARY_REPORT.items : [];
    const capabilityTargets = Array.isArray(CAPABILITY_DECLARATIONS.targets) ? CAPABILITY_DECLARATIONS.targets : [];
    const privacyManifests = Array.isArray(CAPABILITY_DECLARATIONS.privacyManifests) ? CAPABILITY_DECLARATIONS.privacyManifests : [];
    const LOCALES = REPORT.locales || {};
    const localeRows = Array.isArray(LOCALES.rows) ? LOCALES.rows : [];
    const targetHasDeclarations = target => Boolean(target.extensionPoint)
      || ["permissions","backgroundModes","backgroundTasks","urlSchemes","queriedSchemes","bonjourServices","transportDomains","requiredDeviceCapabilities","entitlements"]
        .some(key => Array.isArray(target[key]) && target[key].length);
    const declaredTargets = capabilityTargets.filter(targetHasDeclarations);
    const hasCapabilities = declaredTargets.length > 0 || privacyManifests.length > 0;
    document.getElementById("binaries-nav").hidden = binaryItems.length === 0;
    document.getElementById("view-binaries").hidden = binaryItems.length === 0;
    document.getElementById("capabilities-nav").hidden = !hasCapabilities;
    document.getElementById("view-capabilities").hidden = !hasCapabilities;
    document.getElementById("locales-nav").hidden = localeRows.length === 0;
    document.getElementById("view-locales").hidden = localeRows.length === 0;
    const EXTRA_CATEGORY_NAMES = { binary_section:"Binary sections" };
    const categoryName = id => id === "image" ? "Loose images" : REPORT.categories.find(category => category.id === id)?.label || EXTRA_CATEGORY_NAMES[id] || String(id || "other").replaceAll("_"," ");
    function nodeColor(node) {
      const name = String(node.name || "").toLowerCase();
      if (node.category === "binary_section") {
        const match = Object.entries(SECTION_COLORS).find(([key]) => name === key || name.startsWith(`${key}_`));
        if (match) return match[1];
        const variants = ["#126784","#315a87","#574a84","#176b68"];
        return variants[hash(node.path) % variants.length];
      }
      return COLORS[node.category] || COLORS.other;
    }

    document.title = `${app.name} — OpenBundle`;
    const initials = app.name.split(/\s+/).slice(0,2).map(value => value[0]).join("").toUpperCase();
    const icon = app.iconDataURL
      ? `<span class="app-icon"><img src="${esc(app.iconDataURL)}" alt=""></span>`
      : `<span class="app-icon">${esc(initials || "A")}</span>`;
    document.getElementById("rail-app").innerHTML = `${icon}<h1>${esc(app.name)}</h1>`;
    document.getElementById("rail-metrics").innerHTML = `
      <div class="rail-metric"><span>Download</span><strong>${fmt(metrics.artifactSize || metrics.compressedSize)}</strong></div>
      <div class="rail-metric"><span>Unpacked</span><strong>${fmt(metrics.logicalSize)}</strong></div>`;

    function showView(viewName) {
      document.querySelectorAll(".side-nav button[data-view]").forEach(button => {
        const active = button.dataset.view === viewName;
        button.classList.toggle("active",active);
        button.setAttribute("aria-pressed",String(active));
        if (active) button.setAttribute("aria-current","page");
        else button.removeAttribute("aria-current");
      });
      document.querySelectorAll(".view").forEach(view => view.classList.toggle("active",view.id === `view-${viewName}`));
      if (viewName === "map") requestAnimationFrame(() => renderMap({preserveFocus:true}));
    }
    document.querySelectorAll(".side-nav button[data-view]").forEach(button => button.addEventListener("click",() => showView(button.dataset.view)));
    document.getElementById("compare-nav").addEventListener("click",() => {
      if (window.parent !== window) {
        window.parent.postMessage({type:"openbundle:compare-request",version:1},"*");
      } else {
        window.open("https://games.jacobstechtavern.com/openbundle/","_blank","noopener,noreferrer");
      }
    });
    const initialView = location.hash.slice(1);
    if ([...document.querySelectorAll(".side-nav button")].some(button => !button.hidden && button.dataset.view === initialView)) showView(initialView);

    const treeState = { focusStack:[REPORT.tree] };
    const focusNode = () => treeState.focusStack.at(-1);
    const nodeSize = node => Number(node?.[METRIC] ?? node?.size ?? 0);
    function compactNodes(nodes,bounds,depth) {
      const sorted = [...nodes].filter(node => nodeSize(node) > 0).sort((a,b) => nodeSize(b) - nodeSize(a));
      if (!sorted.length) return [];
      const phone = innerWidth <= 760;
      const limit = phone ? (depth === 0 ? 22 : 9) : (depth === 0 ? 40 : 14);
      const minimumArea = phone ? 180 : 120;
      const total = sorted.reduce((sum,item) => sum + nodeSize(item),0);
      const area = Math.max(1,bounds.width * bounds.height);
      let keepCount = sorted.length;

      const approximate = ["strip-symbols","exported-symbols","asset-catalog-scales"].includes(item.id) ? "~" : "";
      const saving = Number.isFinite(Number(row.savings)) ? `${approximate}${fmt(row.savings)}` : Number.isFinite(Number(row.size)) ? fmt(row.size) : "";

      const hidden = index >= RECOMMENDATION_EVIDENCE_LIMIT ? " hidden" : "";
      const primary = `<div class="evidence-primary"><strong title="${esc(title)}">${esc(title)}</strong>${meta ? `<span title="${esc(meta)}">${esc(meta)}</span>` : ""}</div>`;
      if (!expandable) {

    const binarySort = { key:"size", direction:-1 };

    })[String(value || "").toLowerCase()] || String(value || "Unknown").replaceAll("-"," ");
    function binarySortValue(binary,key) {

      if (key === "architecture") return (binary.architectureNames || []).join(",");

          ? leftValue - rightValue
          : String(leftValue).localeCompare(String(rightValue),undefined,{numeric:true,sensitivity:"base"});
        return comparison * binarySort.direction || String(left.path || "").localeCompare(String(right.path || ""));
      });
    }
    function binarySortButton(title,key) {

    }
    function binarySegmentColor(name,path) {
      return nodeColor({name,path,category:"binary_section"});
    }
    function binaryComposition(binary) {
      if (!(binary.architectures || []).length) return `<div class="binary-composition"><div class="empty-state">Mach-O metadata unavailable.</div></div>`;
      return `<div class="binary-composition">${(binary.architectures || []).map(architecture => {
        const architectureTags = [

    function capabilitiesChipGroup(title,values) {

      const chips = (title,values) => {
        const count = (values || []).filter(value => String(value || "").length).length;
        add(capabilitiesChipGroup(title,values),1 + Math.ceil(Math.min(count,18) / 3) + (count > 18 ? 1 : 0));
      };
      chips("Background",[
        ...(Array.isArray(target.backgroundModes) ? target.backgroundModes : []),
        ...(Array.isArray(target.backgroundTasks) ? target.backgroundTasks : [])
      ]);
      chips("URL schemes",target.urlSchemes);
      chips("Queried schemes",target.queriedSchemes);
      chips("Bonjour",target.bonjourServices);
      chips("Transport domains",target.transportDomains);
      chips("Required hardware",target.requiredDeviceCapabilities);
      if (target.extensionPoint) chips("Extension point",[target.extensionPoint]);
      const entitlements = (Array.isArray(target.entitlements) ? target.entitlements : []).map(item => ({label:item.label,value:(Array.isArray(item.values) ? item.values : []).join(", ")}));
      add(capabilitiesDetailGroup("Entitlements",entitlements),1 + entitlements.length * 2);
      const columnCount = Math.min(4,groups.length);
      const columns = Array.from({length:columnCount},() => ({weight:0,groups:[]}));
      groups.sort((a,b) => b.weight - a.weight || a.order - b.order).forEach(group => {
        const column = columns.reduce((shortest,candidate) => candidate.weight < shortest.weight ? candidate : shortest,columns[0]);
        column.groups.push(group.html);
        column.weight += group.weight;
      });
      return {
        columnCount,
        html: columns.map(column => `<div class="capabilities-column">${column.groups.join("")}</div>`).join("")
      };
    }
    const privacyPurposeLabel = value => String(value || "")
      .replace(/^NSPrivacyCollectedDataTypePurpose/,"")
      .replace(/([a-z0-9])([A-Z])/g,"$1 $2");
    function privacyManifestGroups(manifest) {
      const groups = [];
      groups.push(capabilitiesChipGroup("Tracking domains",manifest.trackingDomains));
      groups.push(capabilitiesDetailGroup("Accessed APIs",(Array.isArray(manifest.accessedAPIs) ? manifest.accessedAPIs : []).map(item => ({label:item.label,value:(Array.isArray(item.reasons) ? item.reasons : []).join(", ")}))));
      groups.push(capabilitiesDetailGroup("Collected data",(Array.isArray(manifest.collectedData) ? manifest.collectedData : []).map(item => {
        const details = [
          ...(item.linked ? ["Linked"] : []),
          ...(item.tracking ? ["Tracking"] : []),
          ...(Array.isArray(item.purposes) ? item.purposes : []).map(privacyPurposeLabel)
        ];
        return {label:item.label,value:details.join(", ")};
      })));
      return groups.filter(Boolean);
    }
    function renderCapabilities() {
      const holder = document.getElementById("capabilities-stack");
      const targetSection = declaredTargets.length ? `
        <section class="capabilities-section">
          <header class="capabilities-section-head"><h3>Targets</h3><span>${declaredTargets.length.toLocaleString()}</span></header>
          <div class="capabilities-targets">${declaredTargets.map(target => {
            const layout = targetCapabilityGroups(target);
            return `<article class="capabilities-card">
                <header class="capabilities-target-head">
                  <div class="capabilities-primary"><strong>${esc(target.name)}</strong><span>${esc(target.bundleID || target.path)}</span></div>
                  <span class="capabilities-kind">${esc(target.kind || "Target")}</span>
                </header>
                <div class="capabilities-groups" style="--capability-columns:${layout.columnCount}">${layout.html}</div>
              </article>`;
          }).join("")}</div>
        </section>` : "";
      const manifestSection = privacyManifests.length ? `
        <section class="capabilities-section">
          <header class="capabilities-section-head"><h3>Privacy manifests</h3><span>${privacyManifests.length.toLocaleString()}</span></header>
          <div class="capabilities-manifests">${privacyManifests.map(manifest => {
            const groups = privacyManifestGroups(manifest);
            const counts = [
              `<span class="capabilities-kind">${manifest.source === "app" ? "App" : "Component"}</span>`,
              ...(manifest.tracking ? [`<span class="capabilities-kind">Tracking</span>`] : []),
              ...((manifest.trackingDomains || []).length ? [`<span class="capabilities-kind">${manifest.trackingDomains.length.toLocaleString()} domains</span>`] : []),
              ...((manifest.accessedAPIs || []).length ? [`<span class="capabilities-kind">${manifest.accessedAPIs.length.toLocaleString()} APIs</span>`] : []),
              ...((manifest.collectedData || []).length ? [`<span class="capabilities-kind">${manifest.collectedData.length.toLocaleString()} data types</span>`] : [])
            ].join("");
            const summary = `<div class="capabilities-primary"><strong>${esc(manifest.bundle)}</strong><span title="${esc(manifest.path)}">${esc(manifest.path)}</span></div><div class="capabilities-manifest-counts">${counts}</div>`;
            if (!groups.length) return `<article class="capabilities-manifest"><div class="capabilities-manifest-summary">${summary}</div></article>`;
            return `<details class="capabilities-manifest"><summary>${summary}</summary><div class="capabilities-manifest-body">${groups.join("")}</div></details>`;
          }).join("")}</div>
        </section>` : "";
      holder.innerHTML = targetSection + manifestSection || `<div class="empty-state">No capability declarations.</div>`;
    }

    const localeNames = (() => {
      try { return new Intl.DisplayNames([navigator.language],{type:"language"}); }
      catch (_) { return null; }
    })();
    function localeLabel(locale) {
      if (String(locale).toLowerCase() === "base") return "Base";
      try { return localeNames?.of(String(locale).replaceAll("_","-")) || locale; }
      catch (_) { return locale; }
    }
    function localeNumber(value,options = {}) {
      if (value == null) return `<span class="locales-number" role="cell" aria-label="${esc(`${options.label || "Value"}: unavailable`)}">—</span>`;
      const number = Number(value);
      const className = options.alert && number > 0 ? "locales-number alert" : "locales-number";
      return `<span class="${className}" role="cell" aria-label="${esc(`${options.label || "Value"}: ${number.toLocaleString()}`)}"${options.title ? ` title="${esc(options.title)}"` : ""}>${number.toLocaleString()}</span>`;
    }
    function renderLocaleTable(rows,label = "Locales") {
      return `<div class="locales-table" role="table" aria-label="${esc(label)}" aria-colcount="7" aria-rowcount="${rows.length + 1}">
        <div class="locales-row locales-header" role="row"><span role="columnheader">Locale</span><span role="columnheader">Bundle</span><span role="columnheader">Files</span><span role="columnheader">Keys</span><span role="columnheader">Missing</span><span role="columnheader">Unchanged</span><span role="columnheader">Size</span></div>
        ${rows.map(row => {
          const comparison = row.referenceLocale && row.referenceLocale !== row.locale ? `Compared with ${row.referenceLocale}` : "";
          const localeDetail = comparison ? `${row.locale} vs ${row.referenceLocale}` : row.locale;
          const bundleDetail = row.bundle !== row.target ? row.target : row.bundlePath === "." ? "Main target" : row.bundlePath;
          return `<div class="locales-row" role="row">
            <div class="locales-primary" role="rowheader"><strong>${esc(localeLabel(row.locale))}</strong><span>${esc(localeDetail)}</span></div>
            <div class="locales-bundle" role="cell" aria-label="${esc(`Bundle: ${row.bundle}, ${bundleDetail}`)}"><strong title="${esc(row.bundlePath)}">${esc(row.bundle)}</strong><span>${esc(bundleDetail)}</span></div>
            ${localeNumber(row.fileCount,{label:"Files"})}
            ${localeNumber(row.parsedFileCount ? row.keyCount : null,{label:"Keys"})}
            ${localeNumber(row.missingKeyCount,{alert:true,title:comparison,label:"Missing"})}
            ${localeNumber(row.identicalValueCount,{title:comparison,label:"Unchanged"})}
            <span class="locales-number" role="cell" aria-label="Size: ${fmt(row.size)}">${fmt(row.size)}</span>
          </div>`;
        }).join("")}
      </div>`;
    }
    function renderLocaleSection(title,rows,{grouped = false} = {}) {
      if (!rows.length) return "";
      const localeCount = new Set(rows.map(row => row.locale)).size;
      let content = renderLocaleTable(rows,`${title} locales`);
      if (grouped) {
        const bundles = new Map();
        rows.forEach(row => {
          if (!bundles.has(row.bundlePath)) bundles.set(row.bundlePath,[]);
          bundles.get(row.bundlePath).push(row);
        });
        const groups = [...bundles.values()].sort((left,right) => right.reduce((sum,row) => sum + Number(row.size || 0),0) - left.reduce((sum,row) => sum + Number(row.size || 0),0));
        content = `<div class="locales-bundles">${groups.map(group => {
          const first = group[0];
          const groupSize = group.reduce((sum,row) => sum + Number(row.size || 0),0);
          return `<details class="locales-bundle-group">
            <summary>
              <div class="locales-bundle-summary"><strong>${esc(first.bundle)}</strong><span title="${esc(first.bundlePath)}">${esc(first.target)}</span></div>
              <div class="locales-bundle-stats"><span>${new Set(group.map(row => row.locale)).size.toLocaleString()} locales</span><strong>${fmt(groupSize)}</strong></div>
            </summary>
            ${renderLocaleTable(group,`${first.bundle} locales`)}
          </details>`;
        }).join("")}</div>`;
      }
      return `<section class="locales-section">
        <header class="locales-section-head"><h3>${esc(title)}</h3><span>${localeCount.toLocaleString()} locales</span></header>
        ${content}
      </section>`;
    }
    function renderLocales() {
      const appRows = localeRows.filter(row => row.source === "app");
      const componentRows = localeRows.filter(row => row.source !== "app");
      document.getElementById("locales-stack").innerHTML =
        renderLocaleSection("App targets",appRows)
        + renderLocaleSection("Bundled components",componentRows,{grouped:true})
        || `<div class="empty-state">No localized files.</div>`;
    }

    const IMAGE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m5 18 5-5 3 3 2-2 4 4"/></svg>`;
    const LOOSE_IMAGE_EXTENSIONS = new Set([".png",".jpg",".jpeg",".heic",".heif",".gif",".webp",".svg",".pdf"]);
    function isRecognizedLooseImage(node,children) {
      const path = String(node.path || "");
      if (children.length || node.kind !== "file" || node.category !== "image" || path.includes("::")) return false;
      const name = path.split("/").at(-1).toLowerCase();
      const dot = name.lastIndexOf(".");
      return dot >= 0 && LOOSE_IMAGE_EXTENSIONS.has(name.slice(dot));
    }
    function representativeRendition(renditions) {
      const available = renditions.filter(item => Number(item.size || 0) > 0);
      if (!available.length) return null;
      const physical = available.filter(item => item.physical !== false);
      const candidates = physical.length ? physical : available;
      const scaleRank = item => {
        const scale = Number(item.scale || 0);
        if (scale === 3) return [3,0];
        if (scale > 0 && scale < 3) return [2,scale];
        if (scale > 3) return [1,-scale];
        return [0,0];
      };
      return candidates.sort((left,right) => {
        const leftRank = scaleRank(left), rightRank = scaleRank(right);
        const scale = rightRank[0] - leftRank[0] || rightRank[1] - leftRank[1];
        if (scale) return scale;
        const leftArea = Number(left.width || 0) * Number(left.height || 0);
        const rightArea = Number(right.width || 0) * Number(right.height || 0);
        return rightArea - leftArea || Number(right.size || 0) - Number(left.size || 0) || String(right.name || "").localeCompare(String(left.name || ""));
      })[0];
    }
    function collectImages() {
      const images = [];
      const seen = new Set();
      const visit = node => {
        const children = node.children || [];
        const isCatalogImage = node.kind === "asset" && node.metadata?.assetType === "image" && String(node.path || "").includes("::");
        const isLooseImage = isRecognizedLooseImage(node,children);
        if ((isCatalogImage || isLooseImage) && !seen.has(node.path)) {
          seen.add(node.path);
          const catalogPath = isCatalogImage ? String(node.path).split("::")[0] : "loose-images";
          const renditions = Array.isArray(node.metadata?.renditions) ? node.metadata.renditions : [];
          const headline = node.metadata?.headlineRendition || representativeRendition(renditions);
          images.push({
            ...node,
            source:catalogPath,
            headlineSize:isCatalogImage ? Number(headline?.size || nodeSize(node)) : nodeSize(node),
            optimizationSaving:isCatalogImage ? Number(headline?.savings || 0) : Number(node.metadata?.optimizationSavingsEstimate || 0),
            thumbnail:String(node.metadata?.thumbnailDataURL || ""),
            renditions,
            renditionCount:Number(node.metadata?.renditionCount || 0)
          });
        }
        children.forEach(visit);
      };
      visit(REPORT.tree);
      return images.sort((a,b) => b.headlineSize - a.headlineSize);
    }
    function sourceLabel(source) {
      if (source === "all-images") return "All images";
      if (source === "loose-images") return "Loose images";
      const parts = source.split("/");
      if (parts.length > 1) return `${parts.at(-2)}/${parts.at(-1)}`;
      return parts[0];
    }
    const imageAssets = collectImages();
    const sourceMap = new Map();
    imageAssets.forEach(asset => {
      if (!sourceMap.has(asset.source)) sourceMap.set(asset.source,[]);
      sourceMap.get(asset.source).push(asset);
    });
    const savingAssets = imageAssets.filter(asset => asset.optimizationSaving > 0).sort((a,b) => b.optimizationSaving - a.optimizationSaving);
    const imageSources = [
      ...(savingAssets.length ? [{id:"potential-savings",label:"Potential savings",assets:savingAssets,value:savingAssets.reduce((sum,item) => sum + item.optimizationSaving,0)}] : []),
      {id:"all-images",label:"All image assets",assets:imageAssets},
      ...[...sourceMap.entries()].map(([id,assets]) => ({id,label:sourceLabel(id),assets})).sort((a,b) => b.assets.reduce((sum,item) => sum + item.headlineSize,0) - a.assets.reduce((sum,item) => sum + item.headlineSize,0))
    ];
    let selectedImageSource = imageSources[0]?.id || "all-images";
    let imageLimit = 200;
    function renderImageSources() {
      document.getElementById("image-total").textContent = `${imageAssets.length.toLocaleString()} image assets`;
      document.getElementById("image-sources").innerHTML = imageSources.map(source => {
        const total = source.value ?? source.assets.reduce((sum,item) => sum + item.headlineSize,0);
        const sourceTitle = ["potential-savings","all-images","loose-images"].includes(source.id) ? source.label : source.id;
        const value = source.id === "potential-savings" ? `<span>${fmt(total)}</span>` : "";
        return `<button class="image-source ${source.id === selectedImageSource ? "active" : ""}" data-source="${esc(source.id)}" title="${esc(sourceTitle)}" aria-pressed="${source.id === selectedImageSource}"><strong>${esc(source.label)}</strong>${value}</button>`;
      }).join("");
      document.querySelectorAll(".image-source").forEach(button => button.addEventListener("click",() => {
        selectedImageSource = button.dataset.source;
        imageLimit = 200;
        renderImageSources();
        renderImageList();
        [...document.querySelectorAll(".image-source")].find(item => item.dataset.source === selectedImageSource)?.focus();
      }));
    }
    function appendRenditionMetadata(holder,text,className = "") {
      const item = document.createElement("span");
      item.textContent = text;
      if (className) item.className = className;
      holder.appendChild(item);
    }
    function renderRenditions(holder,asset) {
      const fragment = document.createDocumentFragment();
      const renditions = [...asset.renditions].sort((left,right) => Number(right.size || 0) - Number(left.size || 0));
      renditions.forEach(rendition => {
        const row = document.createElement("div");
        row.className = "rendition-row";

        const copy = document.createElement("div");
        copy.className = "rendition-copy";
        const name = document.createElement("strong");
        name.textContent = String(rendition.name || "Rendition");
        copy.appendChild(name);

        const metadata = document.createElement("div");
        metadata.className = "rendition-meta";
        if (rendition.width && rendition.height) appendRenditionMetadata(metadata,`${Number(rendition.width).toLocaleString()}×${Number(rendition.height).toLocaleString()}`);
        if (rendition.scale) appendRenditionMetadata(metadata,`${rendition.scale}x`);
        if (rendition.encoding) appendRenditionMetadata(metadata,String(rendition.encoding).toUpperCase());
        if (typeof rendition.opaque === "boolean") appendRenditionMetadata(metadata,rendition.opaque ? "Opaque" : "Alpha");
        if (rendition.optimizationMethod) appendRenditionMetadata(metadata,String(rendition.optimizationMethod));
        if (rendition.duplicateGroup) appendRenditionMetadata(metadata,`Duplicate ${String(rendition.duplicateGroup)}`,"rendition-duplicate");
        copy.appendChild(metadata);

        const size = document.createElement("div");
        size.className = "rendition-size";
        const originalSize = document.createElement("strong");
        const targetSize = Number(rendition.optimizedSize || 0);
        originalSize.textContent = targetSize > 0
          ? `${fmt(rendition.size)} → ${fmt(targetSize)}`
          : fmt(rendition.size);
        size.appendChild(originalSize);

        row.append(copy,size);
        fragment.appendChild(row);
      });
      holder.replaceChildren(fragment);
    }
    function renderImageList({focusAssetIndex = -1} = {}) {
      const source = imageSources.find(item => item.id === selectedImageSource) || imageSources[0];
      const assets = source?.assets || [];
      const visibleAssets = assets.slice(0,imageLimit);
      document.getElementById("image-source-title").textContent = source?.label || "Images";
      document.getElementById("image-source-count").textContent = `${assets.length.toLocaleString()} image assets`;
      const list = document.getElementById("image-list");
      list.innerHTML = visibleAssets.map((asset,index) => {
        const details = [];
        if (asset.source !== "loose-images" && ["all-images","potential-savings"].includes(source.id)) details.push(sourceLabel(asset.source));
        else if (asset.renditionCount > 1) details.push(`${asset.renditionCount.toLocaleString()} renditions`);
        if (!details.length) details.push(asset.path);
        const saving = Number(asset.optimizationSaving || 0);
        const visual = asset.thumbnail
          ? `<span class="image-row-icon has-preview"><img src="${esc(asset.thumbnail)}" alt=""></span>`
          : `<span class="image-row-icon">${IMAGE_ICON}</span>`;
        const summary = `${visual}
          <div class="image-row-copy"><strong>${esc(asset.name)}</strong><span>${esc(details.join("  "))}</span></div>
          <div class="image-row-size"><strong>${fmt(asset.headlineSize)}</strong>${saving > 0 ? `<span>Save ${fmt(saving)}</span>` : ""}</div>`;
        if (!asset.renditions.length) return `<div class="image-row" data-image-index="${index}" tabindex="-1" title="${esc(asset.path)}">${summary}</div>`;
        return `<details class="image-asset" data-asset-index="${index}"><summary class="image-row" data-image-index="${index}" title="${esc(asset.path)}">${summary}</summary><div class="rendition-list"></div></details>`;
      }).join("") + (assets.length > imageLimit ? `<button class="show-more" id="show-more-images">Show more</button>` : "") || `<div class="empty-state">No images found.</div>`;
      list.querySelectorAll(".image-asset[data-asset-index]").forEach(element => element.addEventListener("toggle",() => {
        if (!element.open || element.dataset.renditionsRendered === "true") return;
        const asset = visibleAssets[Number(element.dataset.assetIndex)];
        const holder = element.querySelector(".rendition-list");
        if (!asset || !holder) return;
        renderRenditions(holder,asset);
        element.dataset.renditionsRendered = "true";
      }));
      document.getElementById("show-more-images")?.addEventListener("click",() => {
        const firstNewIndex = visibleAssets.length;
        imageLimit += 200;
        renderImageList({focusAssetIndex:firstNewIndex});
      });
      if (focusAssetIndex >= 0) list.querySelector(`[data-image-index="${focusAssetIndex}"]`)?.focus();
    }

    renderRecommendations();
    renderArchitecture();
    renderBinaries();
    renderCapabilities();
    renderLocales();
    renderImageSources();
    renderImageList();
    renderMap();
    let resizeTimer;
    addEventListener("resize",() => {
      const focusedPath = document.activeElement?.dataset?.nodePath;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => renderMap({preserveFocusPath:focusedPath}),100);
    });
  })();
  </script>
</body>
</html>
